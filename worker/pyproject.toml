[project]
name = "radar-b2b-worker"
version = "0.1.0"
description = "Worker de Radar B2B: conectores, normalización, resolución de entidades, verificación y agente."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "httpx>=0.27",
  "trafilatura>=1.12",
  "selectolax>=0.3",
  "rapidfuzz>=3.9",
  "phonenumbers>=8.13",
  "pandas>=2.2",
  "anthropic>=0.34",
  "supabase>=2.7",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
web-js = [
  "playwright>=1.46",  # solo para webs que requieren JS (doc 02 §3)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]
