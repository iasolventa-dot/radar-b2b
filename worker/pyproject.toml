[project]
name = "radar-b2b-worker"
version = "0.1.0"
description = "Worker de Radar B2B: conectores, normalización, resolución de entidades, verificación y agente."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "httpx>=0.27",
  "trafilatura>=1.12",
  "selectolax>=0.3",
  "rapidfuzz>=3.9",
  "phonenumbers>=8.13",
  "pandas>=2.2",
  "anthropic>=0.34",  # solo si PROVEEDOR_LLM=anthropic (doc 02 §3) — el proveedor por defecto es openai
  "openai>=3.0",  # verificado contra la 3.13.0 instalada 2026-09-11 (Responses API, .parse(), max_tool_calls)
  "supabase>=2.7",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "tenacity>=8.5",
  "fastapi>=0.115",  # tarea #22 (radar.api) — verificado contra la 0.141.1 instalada 2026-09-11
  "uvicorn[standard]>=0.30",  # servidor ASGI para radar.api en Railway (D-07)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
web-js = [
  "playwright>=1.46",  # solo para webs que requieren JS (doc 02 §3)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# "3.12", no "3.11" (requires-python arriba sigue en >=3.11: esto NO cambia
# el runtime, solo la gramática que mypy se permite entender al leer
# *stubs* de dependencias). Numpy 2.4.x (que trae pandas) usa `type X = ...`
# (PEP 695) en su __init__.pyi, sintaxis que mypy solo parsea si
# python_version >= 3.12 — con 3.11 falla con "Type statement is only
# supported in Python 3.12 and greater" al mirar ese stub, aunque el
# archivo que de verdad se está comprobando no tenga nada que ver con numpy.
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]
